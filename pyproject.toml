[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort"
version = "0.1.0"
description = "Evidential pluralism made auditable: a supervised evidence graph for multi-agent textual research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# The researcher UI (stage 5). Optional on purpose: the core library and CLI
# must never require it to be installed or running (docs/roadmap.md "Decisions
# already made"), same pattern as `dev`. `cohort/ui/` is the only place that
# may import from it.
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
# The agent/LLM layer (cohort/agents/) uses OpenRouter over stdlib
# urllib.request, not a client library — see cohort/agents/openrouter.py's
# module docstring for why. No extra needed for it.

[project.scripts]
# The terminal front end. Same capabilities as the web UI, enforced by
# tests/test_parity.py rather than by intention.
cohort = "cohort.cli:main"

[tool.setuptools.packages.find]
include = ["cohort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Strict on purpose, and checked in CI-style by `uvx ruff check .`: a house
# style that lives in a config can be enforced; one that lives in a README
# cannot. 100 columns because the docstrings here explain *why*, and 88 made
# them terse.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "SIM",         # simplify
    "RUF",         # ruff's own
    "TID252",      # absolute imports, not relative
    "PT",          # pytest style
    "C4",          # comprehensions
    "PIE",         # misc lints
    "RET",         # return statements
    "PL",          # pylint (errors, warnings, and the refactor rules below)
]
ignore = [
    "B008",        # FastAPI's Query(...)/Body(...) in defaults is the framework's idiom
    "PLR2004",     # magic-value comparisons: thresholds here are named where it matters
    "PLR0913",     # many arguments: the tool schemas mirror the API
    "PLR0912", "PLR0915", "PLR0911", "C901",  # complexity: measured by tests, not by counting branches
    "E501",        # long lines: only in the places below
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: the corpus is Chinese and the docs use dashes
    "SIM115",      # graph.py holds the flock handle open on purpose
    "PT011",       # broad pytest.raises where the message is asserted separately
    "RUF012",      # mutable class attributes on pydantic models
    "PLC0415",     # imports inside functions: the core stays importable without the optional extras
    "PLR0917",     # positional-argument counts: mirrors the tool schemas
    "PT018",       # composite asserts: this suite states one invariant per assert, joined with `and`
    "PLW2901",     # `line = line.strip()` inside a loop is the idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"scripts/*" = ["T201"]
