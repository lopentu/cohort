# Candidate for the existing HTTPS vhost's locations.d include.
# Install only after the contract, restore and cutover gates pass.
location = /cohort {
    return 308 /cohort/;
}
location /cohort/ {
    proxy_pass http://127.0.0.1:18766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace client-supplied forwarding chains; do not append them.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_buffering off;
    client_max_body_size 1m;
}
